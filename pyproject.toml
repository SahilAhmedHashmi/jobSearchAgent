[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-job-agent-search"
version = "0.3.0"
description = "Stateless agent-operated job search with runtime resumes and external reports"
requires-python = ">=3.10"
dependencies = ["pypdf>=4,<7", "python-docx>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
job-agent = "job_agent.cli:main"

[tool.setuptools.packages.find]
include = ["job_agent*"]
